name: Linux test packages

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish an experimental GitHub pre-release (master only)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - master
      - 'ci/**'
    paths:
      - '.github/workflows/linux-packages.yml'
      - 'ci/linux/**'
      - 'app/**'
      - 'libgimp*/**'
      - 'plug-ins/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'build/linux/appimage/**'
  pull_request:
    paths:
      - '.github/workflows/linux-packages.yml'
      - 'ci/linux/**'
      - 'app/**'
      - 'libgimp*/**'
      - 'plug-ins/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'build/linux/appimage/**'

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build ${{ matrix.format }} (Debian 13 x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        format: [deb, appimage]
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl wget file patchelf zsync appstream \
            build-essential pkgconf meson ninja-build cmake bison flex gettext \
            desktop-file-utils gobject-introspection libgtk-3-bin locales \
            valac xsltproc dpkg-dev bash python3 python3-gi python3-gi-cairo \
            at-spi2-core ffmpeg gjs glib-networking graphviz gvfs iso-codes \
            libaa1-dev libappstream-dev libarchive-dev libasound2-dev \
            libbz2-dev libcfitsio-dev libgexiv2-dev libgirepository1.0-dev \
            libgs-dev libgtk-3-dev libgudev-1.0-dev libheif-dev \
            libjson-glib-dev libjxl-dev liblcms2-dev liblzma-dev \
            libmaxflow-dev libmng-dev libmypaint-dev libomp-dev \
            libopenexr-dev libopenjp2-7-dev libpoppler-glib-dev \
            libqoi-dev libraw-dev librsvg2-dev libsuitesparse-dev \
            libtiff-dev libunwind-dev libwebp-dev libwmf-dev \
            libxmu-dev libxpm-dev mypaint-brushes poppler-data xdg-utils \
            libbacktrace-dev libheif-plugin-dav1d libheif-plugin-aomenc \
            libheif-plugin-libde265 libheif-plugin-x265
          echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
          locale-gen
      - name: Checkout fork with GIMP data
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Compile fork and make ${{ matrix.format }}
        shell: bash
        env:
          BUILD_FORMAT: ${{ matrix.format }}
        run: bash ci/linux/build-package.sh "$BUILD_FORMAT"
      - name: Validate generated package
        shell: bash
        env:
          BUILD_FORMAT: ${{ matrix.format }}
        run: bash ci/linux/smoke-test.sh "$BUILD_FORMAT"
      - name: Upload test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gimp-photo-${{ matrix.format }}-x86_64
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Meson build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.format }}
          path: |
            _build-package/meson-logs/**
            babl/_build/meson-logs/**
            gegl/_build/meson-logs/**
          if-no-files-found: ignore
          retention-days: 7

  release-preview:
    name: Publish experimental Linux pre-release
    needs: packages
    runs-on: ubuntu-24.04
    if: >-
      github.ref == 'refs/heads/master' &&
      (
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-photo-preview]')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      )
    permissions:
      contents: write
    steps:
      - name: Fetch tested AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: gimp-photo-appimage-x86_64
          path: fetched/appimage
      - name: Fetch tested Debian artifact
        uses: actions/download-artifact@v4
        with:
          name: gimp-photo-deb-x86_64
          path: fetched/deb
      - name: Prepare release packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(fetched/appimage/*.AppImage)
          debs=(fetched/deb/*.deb)
          (( ${#appimages[@]} == 1 )) || { echo "AppImage artifact missing or ambiguous" >&2; exit 1; }
          (( ${#debs[@]} == 1 )) || { echo "Debian artifact missing or ambiguous" >&2; exit 1; }
          mkdir -p release-files
          cp -v "${appimages[0]}" "${debs[0]}" release-files/
          (cd release-files && sha256sum -- *.AppImage *.deb > SHA256SUMS)
          cat > release-notes.md <<'NOTES'
          # Experimental GIMP photo workspace (Linux x86_64)

          This **unofficial development preview** includes the GIMP fork's fixed
          photographic sidebar and live Light adjustments (Exposure, Contrast,
          Highlights and Shadows), with Apply/Cancel. The default start screen
          remains the normal GIMP interface; click **Photo workspace** in the
          top bar to enter the photographic layout.

          The pre-release is **not a complete Lightroom interface**.
          UI interaction and long editing sessions still require real-desktop
          validation. Back up important projects before testing.

          **AppImage:** download, mark executable (`chmod +x file.AppImage`)
          and run on a Linux x86_64 desktop.

          **.deb:** intended for Debian 13 (trixie) x86_64 only; it installs
          to `/opt/gimp-photo-dev` and launches via `gimp-photo-dev`.
          It does not replace the distribution's GIMP package.

          SHA256 checksums are attached. Source code for this build is the
          corresponding tagged commit in this repository; GIMP's GPL applies.
          NOTES
      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="photo-preview-${GITHUB_SHA:0:7}"
          gh release create "$tag" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GIMP Photo Workspace · Preview ${GITHUB_SHA:0:7}" \
            --notes-file release-notes.md \
            --prerelease
