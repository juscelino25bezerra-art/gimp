name: Linux test packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'ci/**'
    paths:
      - '.github/workflows/linux-packages.yml'
      - 'ci/linux/**'
      - 'app/**'
      - 'libgimp*/**'
      - 'plug-ins/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'build/linux/appimage/**'
  pull_request:
    paths:
      - '.github/workflows/linux-packages.yml'
      - 'ci/linux/**'
      - 'app/**'
      - 'libgimp*/**'
      - 'plug-ins/**'
      - 'meson.build'
      - 'meson_options.txt'
      - 'build/linux/appimage/**'

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build ${{ matrix.format }} (Debian 13 x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        format: [deb, appimage]
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl wget file patchelf zsync appstream \
            build-essential pkgconf meson ninja-build cmake bison flex gettext \
            desktop-file-utils gobject-introspection libgtk-3-bin locales \
            valac xsltproc dpkg-dev bash python3 python3-gi python3-gi-cairo \
            at-spi2-core ffmpeg gjs glib-networking graphviz gvfs iso-codes \
            libaa1-dev libappstream-dev libarchive-dev libasound2-dev \
            libbz2-dev libcfitsio-dev libgexiv2-dev libgirepository1.0-dev \
            libgs-dev libgtk-3-dev libgudev-1.0-dev libheif-dev \
            libjson-glib-dev libjxl-dev liblcms2-dev liblzma-dev \
            libmaxflow-dev libmng-dev libmypaint-dev libomp-dev \
            libopenexr-dev libopenjp2-7-dev libpoppler-glib-dev \
            libqoi-dev libraw-dev librsvg2-dev libsuitesparse-dev \
            libtiff-dev libunwind-dev libwebp-dev libwmf-dev \
            libxmu-dev libxpm-dev mypaint-brushes poppler-data xdg-utils \
            libbacktrace-dev libheif-plugin-dav1d libheif-plugin-aomenc \
            libheif-plugin-libde265 libheif-plugin-x265
          echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
          locale-gen
      - name: Checkout fork with GIMP data
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Compile fork and make ${{ matrix.format }}
        shell: bash
        env:
          BUILD_FORMAT: ${{ matrix.format }}
        run: bash ci/linux/build-package.sh "$BUILD_FORMAT"
      - name: Validate generated package
        shell: bash
        env:
          BUILD_FORMAT: ${{ matrix.format }}
        run: bash ci/linux/smoke-test.sh "$BUILD_FORMAT"
      - name: Upload test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gimp-photo-${{ matrix.format }}-x86_64
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Meson build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.format }}
          path: |
            _build-package/meson-logs/**
            babl/_build/meson-logs/**
            gegl/_build/meson-logs/**
          if-no-files-found: ignore
          retention-days: 7
